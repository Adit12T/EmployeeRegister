spring:
  application:
    name: employee-register
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/employee_register}
      auto-index-creation: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never
