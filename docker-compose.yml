services:
  mongo:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/employee_register
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
